version: '3.9'
services:
  cloudflare-ddns:
    image: ghcr.io/lynxluu/cloudflare-ddns:1.0.3
    container_name: ddns
    security_opt:
      - no-new-privileges:true
    network_mode: 'host'
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ../config.json:/config.json
    restart: unless-stopped
